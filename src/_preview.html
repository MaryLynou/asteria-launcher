<!DOCTYPE html>
<!-- FICHIER GENERE — ne pas modifier a la main.
     Copie de index.html sans la CSP et avec _preview-mock.js, pour regarder l'interface dans un
     navigateur (npx http-server src, ou la configuration « apercu-launcher » de .claude/launch.json)
     sans lancer Electron ni toucher au client installe. A regenerer apres toute modification de
     index.html :
       python -c "import io;s=io.open('src/index.html',encoding='utf-8').read();import re;s=re.sub(r'<meta http-equiv=\"Content-Security-Policy\"[\s\S]*?/>','',s);s=s.replace('<script src=\"i18n.js\"></script>','<script src=\"i18n.js\"></script>
  <script src=\"_preview-mock.js\"></script>');io.open('src/_preview.html','w',encoding='utf-8',newline='
').write(s)"
     Exclu du build par le motif !src/_preview* de package.json. -->
<html lang="fr">
<head>
<meta charset="UTF-8" />

<title>Asteria Launcher</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- fond : nebuleuse + deux couches d'etoiles en parallaxe -->
  <div class="sky"></div>
  <div class="stars stars-1"></div>
  <div class="stars stars-2"></div>

  <div class="titlebar">
    <div class="titlebar-brand"><span class="star sm"></span> Asteria Launcher</div>
    <div class="titlebar-spacer"></div>
    <button class="title-btn" id="btn-min" title="—">—</button>
    <button class="title-btn close" id="btn-close" title="✕">✕</button>
  </div>

  <div class="app">
    <!-- ------------------------------------------------------------------ barre laterale -->
    <aside class="sidebar">
      <div class="sidebar-head">
        <img class="sidebar-mark" src="logo.png" alt="" />
        <div>
          <div class="sidebar-name">ASTERIA</div>
          <div class="sidebar-sub" data-i18n="app.tagline"></div>
        </div>
      </div>

      <div class="nav-item active" id="nav-play"><span class="ico">▶</span><span data-i18n="nav.play"></span></div>

      <div class="nav-label"><span data-i18n="nav.content"></span></div>
      <div class="nav-item" data-page="/actualites"><span class="ico">📰</span><span data-i18n="nav.news"></span></div>
      <div class="nav-item" data-page="/classement"><span class="ico">🏆</span><span data-i18n="nav.ranking"></span></div>
      <div class="nav-item" data-page="/vote"><span class="ico">🗳</span><span data-i18n="nav.vote"></span></div>
      <div class="nav-item" data-page="/boutique"><span class="ico">🛒</span><span data-i18n="nav.shop"></span></div>

      <div class="nav-label"><span data-i18n="nav.community"></span></div>
      <div class="nav-item" data-page="/wiki"><span class="ico">📖</span><span data-i18n="nav.wiki"></span></div>
      <div class="nav-item" id="nav-discord"><span class="ico">💬</span><span data-i18n="nav.discord"></span></div>

      <div class="nav-label"></div>
      <div class="nav-item" id="nav-settings"><span class="ico">⚙</span><span data-i18n="nav.settings"></span></div>

      <div class="sidebar-foot">
        <div class="server-line">
          <span class="dot" id="dot-side"></span>
          <span id="server-side" data-i18n="server.checking"></span>
        </div>
        <div class="version-line" id="version-line"></div>
      </div>
    </aside>

    <!-- --------------------------------------------------------------------- zone centrale -->
    <main class="main">
      <div class="hero">
        <img class="hero-mark" src="logo.png" alt="Asteria" />
        <div class="hero-rule"><span class="star"></span></div>
        <div class="hero-tagline" data-i18n="app.tagline"></div>
        <div class="pill">
          <span class="dot" id="dot-hero"></span>
          <span id="server-hero" data-i18n="server.checking"></span>
          <span class="sep"></span>
          <span class="muted" id="players-text"></span>
        </div>
      </div>

      <section class="news">
        <div class="news-head">
          <span class="star sm"></span>
          <span data-i18n="news.title"></span>
          <span class="link" id="news-all" data-i18n="news.readMore"></span>
        </div>
        <div class="news-grid" id="news-grid"></div>
      </section>

      <section class="launch">
        <div class="status-row">
          <span id="status-text"></span>
          <span class="speed" id="speed-text"></span>
          <span class="pct" id="pct-text"></span>
        </div>
        <div class="track" id="track"><div class="fill" id="fill"></div></div>
        <div class="launch-row">
          <button id="play-btn" disabled data-i18n="button.wait"></button>
          <div class="arch-switch">
            <button class="arch-opt" data-setting="arch" data-value="x86" data-i18n="button.arch32"></button>
            <button class="arch-opt" data-setting="arch" data-value="x64" data-i18n="button.arch64"></button>
          </div>
          <button class="ghost-btn" id="check-btn" data-i18n-title="button.checkUpdates">
            <span class="ico">⟳</span><span data-i18n="button.checkUpdates"></span>
          </button>
        </div>
      </section>
    </main>
  </div>

  <!-- ----------------------------------------------------------------------- parametres -->
  <div class="overlay" id="overlay">
    <div class="overlay-head">
      <div class="overlay-title"><span class="star"></span><span data-i18n="settings.title"></span></div>
      <div class="titlebar-spacer"></div>
      <button class="title-btn close" id="settings-close" title="✕">✕</button>
    </div>

    <div class="overlay-body">
      <nav class="tabs">
        <div class="tab active" data-tab="game"><span class="ico">🎮</span><span data-i18n="settings.tab.game"></span></div>
        <div class="tab" data-tab="launcher"><span class="ico">🚀</span><span data-i18n="settings.tab.launcher"></span></div>
        <div class="tab" data-tab="appearance"><span class="ico">🎨</span><span data-i18n="settings.tab.appearance"></span></div>
        <div class="tab" data-tab="about"><span class="ico">ℹ</span><span data-i18n="settings.tab.about"></span></div>
      </nav>

      <div class="panes">
        <!-- ---------------------------------------------------------------- onglet Jeu -->
        <section class="pane active" data-pane="game">
          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.game.title"></span></div>

            <div class="row stacked">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.dir"></div>
                <div class="row-help" data-i18n="settings.game.dirHelp"></div>
              </div>
              <div class="row-side">
                <button class="path-btn" id="dir-btn"><span class="ico">📁</span><span id="dir-text"></span></button>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.autoUpdate"></div>
                <div class="row-help" data-i18n="settings.game.autoUpdateHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="autoUpdate"></div></div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.check"></div>
                <div class="row-help" data-i18n="settings.game.checkHelp"></div>
              </div>
              <div class="row-side">
                <button class="action-btn" id="check-btn-2"><span class="ico">⟳</span><span data-i18n="settings.game.checkBtn"></span></button>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.repair"></div>
                <div class="row-help" data-i18n="settings.game.repairHelp"></div>
              </div>
              <div class="row-side">
                <button class="action-btn" id="repair-btn"><span class="ico">🔧</span><span data-i18n="settings.game.repairBtn"></span></button>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.folder"></div>
                <div class="row-help" data-i18n="settings.game.folderHelp"></div>
              </div>
              <div class="row-side">
                <button class="action-btn" id="folder-btn"><span class="ico">📂</span><span data-i18n="settings.game.folderBtn"></span></button>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.closeOnLaunch"></div>
                <div class="row-help" data-i18n="settings.game.closeOnLaunchHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="closeOnLaunch"></div></div>
            </div>

            <div class="row danger">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.game.uninstall"></div>
                <div class="row-help" data-i18n="settings.game.uninstallHelp"></div>
              </div>
              <div class="row-side">
                <button class="action-btn danger" id="uninstall-btn"><span class="ico">🗑</span><span data-i18n="settings.game.uninstallBtn"></span></button>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.game.arch"></span></div>
            <div class="row stacked">
              <div class="row-text"><div class="row-help" data-i18n="settings.game.archHelp"></div></div>
              <div class="row-side">
                <div class="segmented">
                  <button class="segment" data-setting="arch" data-value="x86" id="arch-x86">
                    <span class="seg-main"><span>🖥</span><span data-i18n="settings.game.arch32"></span></span>
                    <span class="seg-help" id="arch-x86-help"></span>
                  </button>
                  <button class="segment" data-setting="arch" data-value="x64" id="arch-x64">
                    <span class="seg-main"><span>💻</span><span data-i18n="settings.game.arch64"></span></span>
                    <span class="seg-help" id="arch-x64-help"></span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ----------------------------------------------------------- onglet Launcher -->
        <section class="pane" data-pane="launcher">
          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.launcher.title"></span></div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.startup"></div>
                <div class="row-help" data-i18n="settings.launcher.startupHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="startWithWindows"></div></div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.tray"></div>
                <div class="row-help" data-i18n="settings.launcher.trayHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="minimizeToTray"></div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.launcher.notifications"></span></div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.notifyUpdate"></div>
                <div class="row-help" data-i18n="settings.launcher.notifyUpdateHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="notifyUpdateAvailable"></div></div>
            </div>
            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.notifyDone"></div>
                <div class="row-help" data-i18n="settings.launcher.notifyDoneHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="notifyUpdateDone"></div></div>
            </div>
            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.notifyNews"></div>
                <div class="row-help" data-i18n="settings.launcher.notifyNewsHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="notifyNews"></div></div>
            </div>
            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.notifyServer"></div>
                <div class="row-help" data-i18n="settings.launcher.notifyServerHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="notifyServerBack"></div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.launcher.lang"></span></div>
            <div class="row stacked">
              <div class="row-text"><div class="row-help" data-i18n="settings.launcher.langHelp"></div></div>
              <div class="row-side"><div class="segmented" id="lang-segments"></div></div>
            </div>
          </div>

          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.launcher.advanced"></span></div>
            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.launcher.log"></div>
                <div class="row-help" data-i18n="settings.launcher.logHelp"></div>
              </div>
              <div class="row-side">
                <button class="action-btn" id="log-btn"><span class="ico">📄</span><span data-i18n="settings.launcher.logBtn"></span></button>
              </div>
            </div>
          </div>
        </section>

        <!-- ---------------------------------------------------------- onglet Apparence -->
        <section class="pane" data-pane="appearance">
          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.appearance.title"></span></div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.appearance.accent"></div>
                <div class="row-help" data-i18n="settings.appearance.accentHelp"></div>
              </div>
              <div class="row-side"><div class="swatches" id="accent-swatches"></div></div>
            </div>

            <div class="row stacked">
              <div class="row-text"><div class="row-label" data-i18n="settings.appearance.size"></div></div>
              <div class="row-side">
                <div class="segmented">
                  <button class="segment compact" data-setting="windowSize" data-value="small" data-i18n="settings.appearance.size.small"></button>
                  <button class="segment compact" data-setting="windowSize" data-value="medium" data-i18n="settings.appearance.size.medium"></button>
                  <button class="segment compact" data-setting="windowSize" data-value="large" data-i18n="settings.appearance.size.large"></button>
                </div>
              </div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.appearance.animations"></div>
                <div class="row-help" data-i18n="settings.appearance.animationsHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="animations"></div></div>
            </div>

            <div class="row">
              <div class="row-text">
                <div class="row-label" data-i18n="settings.appearance.sounds"></div>
                <div class="row-help" data-i18n="settings.appearance.soundsHelp"></div>
              </div>
              <div class="row-side"><div class="switch" role="switch" data-setting="sounds"></div></div>
            </div>
          </div>
        </section>

        <!-- ------------------------------------------------------------ onglet A propos -->
        <section class="pane" data-pane="about">
          <div class="card">
            <div class="card-title"><span class="star sm"></span><span data-i18n="settings.about.title"></span></div>

            <div class="row">
              <div class="row-text"><div class="row-label" data-i18n="settings.about.launcherVersion"></div></div>
              <div class="row-side value" id="about-launcher"></div>
            </div>
            <div class="row">
              <div class="row-text"><div class="row-label" data-i18n="settings.about.clientVersion"></div></div>
              <div class="row-side value" id="about-client"></div>
            </div>
            <div class="row stacked">
              <div class="row-side about-links">
                <button class="action-btn" id="about-history"><span class="ico">🕘</span><span data-i18n="settings.about.history"></span></button>
                <button class="action-btn" data-page="/"><span class="ico">🌐</span><span data-i18n="settings.about.site"></span></button>
                <button class="action-btn" id="about-discord"><span class="ico">💬</span><span data-i18n="settings.about.discord"></span></button>
                <button class="action-btn" data-page="/wiki"><span class="ico">📖</span><span data-i18n="settings.about.wiki"></span></button>
              </div>
            </div>
            <div class="credits" data-i18n="settings.about.credits"></div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="i18n.js"></script>
  <script src="_preview-mock.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
